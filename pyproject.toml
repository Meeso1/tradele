[project]
name = "tradele"
version = "0.1.0"
description = "Backend API for Tradele, a daily stock-trading guessing game"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "pyjwt[crypto]>=2.13.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ (flake8-datetimez): forbid naive datetime/date construction (e.g.
# `datetime.now()`, `date.today()`) so timestamps are always UTC and
# timezone-aware. See AGENTS.md - the app should use `datetime.now(UTC)`
# everywhere instead.
extend-select = ["DTZ"]

[tool.ruff.lint.per-file-ignores]
# Tests construct fixed, naive dates/times as plain input fixtures rather
# than real "current time" values, so the DTZ rules don't apply there.
"tests/**" = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
reportExplicitAny = false
reportAny = false
reportUnusedCallResult = false
